<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ASCII Tierchen</title>
  <meta name="description" content="Kleine ASCII-Tiere mit wechselnden Gegenständen zum Anschauen und Kopieren.">
  <meta name="theme-color" content="#111111">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="de_DE">
  <meta property="og:site_name" content="ASCII Tierchen">
  <meta property="og:title" content="ASCII Tierchen">
  <meta property="og:description" content="Kleine ASCII-Tiere mit wechselnden Gegenständen zum Anschauen und Kopieren.">
  <meta property="og:url" content="https://marsrakete.github.io/ascii-tierchen/">
  <meta property="og:image" content="https://marsrakete.github.io/ascii-tierchen/og-image.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="ASCII Tierchen mit einem Hasen und einem blauen Eiswürfel.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="ASCII Tierchen">
  <meta name="twitter:description" content="Kleine ASCII-Tiere mit wechselnden Gegenständen zum Anschauen und Kopieren.">
  <meta name="twitter:image" content="https://marsrakete.github.io/ascii-tierchen/og-image.png">
  <meta name="twitter:image:alt" content="ASCII Tierchen mit einem Hasen und einem blauen Eiswürfel.">
  <link rel="icon" href="favicon.ico" type="image/x-icon" sizes="16x16 32x32 48x48">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" sizes="180x180">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="animal-display">
    <h1>ASCII Tierchen</h1>
    <h2 id="animal-name">bunny</h2>
    <pre id="ascii-art">
(\_/)
(•_•)
/ >🧊
    </pre>
  </div>

  <div class="controls">
    <button onclick="changeItem()">Gegenstand wechseln</button>
    <button onclick="changeAnimal()">Tier wechseln</button>
    <button onclick="copyArt()">Bild kopieren</button>
  </div>

  <script>
    let currentAnimalIndex = 0;
    let currentItem = '🧊';

    const items = [
      '🧊', '🥕', '🍫', '🪵', '🍎', '🧁', '🍪', '🌭', '🍓', '🍇',
      '🪙', '🍕', '🌮', '🍔', '🧀', '🍩', '🍌', '🥥', '🧃', '🍷',
      '🍐', '🍊', '🍉', '🍒', '🍑', '🍍', '🥝', '🫐', '🥦', '🥬',
      '🥒', '🌽', '🥔', '🍄', '🥜', '🍞', '🥨', '🥚', '🍗', '🐟'
    ];

    const animalList = [
      'bunny', 'cat', 'donkey', 'duck', 'mouse', 'frog', 'bear', 'snail', 'owl',
      'tiger', 'penguin', 'crab', 'elephant'
    ];

    const animals = {
      bunny: (item) => `(\\_/)
(•_•)
/ >${item}`,

      cat: (item) => ` /\\_/\\
(=^.^=)
 (${item})~`,

      donkey: (item) => `^__^
(oo)\\_______
(__)\\       )\\
    ||----w |
    ||     || ${item}`,

      duck: (item) => ` __
<(o )___
 ( ._>  ${item}
  \\___)` ,

      mouse: (item) => ` (o)_(o)
 ( . . )
  \\_v_/
  (${item})~~`,

      frog: (item) => ` @..@
(----)
( >${item} )
 ^^ ^^`,

      bear: (item) => `  (o)---(o)
  /  . .  \\
 |  ( Y )  |
  \\  \`-'  /
  / ( ${item} ) \\
 (___) (___)`,

      snail: (item) => `  _____
 /     \\
( o  o )
o\\_^_/o ${item}`,

      owl: (item) => ` ,_,
(o,o)
(   )
 "${item}"`,

      tiger: (item) => `  /\\_/\\
 ( o.o )
  > ^ < ${item}`,

      penguin: (item) => `  _~_
 (o o)
 / V \\
/(   )\\
 ^^ ^^ ${item}`,

      crab: (item) => ` \\ /  o  o  \\${item}/
  V   |  |   V
   \\_/----\\_/
    /______\\
    / /  \\ \\`,

      elephant: (item) => `  _.-- ,.--.
 .'   .'     /
 | @       |'..--------._
 /      \\._/              '\\
/  .-.-                     \\
\\_/   ${item}`
    };

    function changeItem() {
      currentItem = items[Math.floor(Math.random() * items.length)];
      updateArt();
    }

    function changeAnimal() {
      currentAnimalIndex = (currentAnimalIndex + 1) % animalList.length;
      updateArt();
    }

    function updateArt() {
      const animalKey = animalList[currentAnimalIndex];
      const art = animals[animalKey](currentItem);
      const artDisplay = document.getElementById('ascii-art');
      artDisplay.textContent = art;
      if (animalKey === 'owl') {
        const feetStart = art.lastIndexOf('\n') + 1;
        const feet = document.createElement('span');
        feet.className = 'owl-feet';
        feet.textContent = art.slice(feetStart);
        artDisplay.textContent = art.slice(0, feetStart);
        artDisplay.append(feet);
      }
      document.getElementById('animal-name').textContent = animalKey;
    }

    function copyArt() {
      const text = document.getElementById('ascii-art').textContent;
      navigator.clipboard.writeText(text).then(() => {
        alert("Bild wurde in die Zwischenablage kopiert!");
      }).catch(err => {
        alert("Kopieren fehlgeschlagen: " + err);
      });
    }
  </script>

</body>
</html>
